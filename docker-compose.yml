services:
  postgres:
    image: postgres:16-alpine
    container_name: quizpeak-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizpeak
      POSTGRES_PASSWORD: quizpeak
      POSTGRES_DB: quizpeak
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quizpeak -d quizpeak']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quizpeak-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: quizpeak-server
    restart: unless-stopped
    env_file: [server/.env]
    environment:
      DATABASE_URL: postgresql://quizpeak:quizpeak@postgres:5432/quizpeak?schema=public
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: quizpeak-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: https://api.example.com/api
    ports:
      - '3001:3001'
    depends_on: [server]

  web-pc:
    build:
      context: .
      dockerfile: web-pc/Dockerfile
    container_name: quizpeak-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: https://api.example.com/api
    ports:
      - '3000:3000'
    depends_on: [server]

volumes:
  pgdata:
  redisdata:
