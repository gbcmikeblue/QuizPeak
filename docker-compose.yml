# 生产部署编排：postgres + api + web + admin + nginx
# 用法：
#   cp .env.production.example .env.production   # 填写密钥
#   docker compose build
#   docker compose up -d
#   docker compose logs -f api
name: quizpeak

services:
  postgres:
    image: postgres:16-alpine
    container_name: quizpeak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizpeak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: ${POSTGRES_DB:-quizpeak}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-quizpeak} -d ${POSTGRES_DB:-quizpeak}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [quizpeak]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    container_name: quizpeak-api
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PORT: 8080
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql://${POSTGRES_USER:-quizpeak}:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/${POSTGRES_DB:-quizpeak}?schema=public
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [quizpeak]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: /api
    container_name: quizpeak-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on: [api]
    networks: [quizpeak]

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_BASE: /api
    container_name: quizpeak-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on: [api]
    networks: [quizpeak]

  nginx:
    image: nginx:1.27-alpine
    container_name: quizpeak-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/quizpeak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    depends_on: [web, admin, api]
    networks: [quizpeak]

volumes:
  pgdata:
  uploads:
  certbot_www:

networks:
  quizpeak:
    driver: bridge
