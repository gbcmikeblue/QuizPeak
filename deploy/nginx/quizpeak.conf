# 知巅 QuizPeak 反向代理
# 域名：把 quizpeak.example.com / admin.quizpeak.example.com 换成正式域名
#
# 启用 HTTPS 的两种方式见 doc/10-上线部署手册.md：
#   1) certbot 独立签发后把证书放到 deploy/certs/{fullchain,privkey}.pem，再打开下方 443 段
#   2) 云厂商 SLB/CDN 终止 TLS，本机只保留 80

upstream zp_web {
    server web:3000;
}

upstream zp_admin {
    server admin:3001;
}

upstream zp_api {
    server api:8080;
}

# 公共代理头
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ---------- 用户端 ----------
server {
    listen 80;
    server_name quizpeak.example.com _;

    # 图片以 base64 上传，服务端上限 8MB，这里留余量
    client_max_body_size 12m;

    # certbot 续期验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://zp_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://zp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- 运营后台 ----------
server {
    listen 80;
    server_name admin.quizpeak.example.com;

    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://zp_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://zp_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

